StylesPath = .vale/styles
MinAlertLevel = error

# Vale reads the comments of a format it parses, so YAML, .editorconfig, .gitattributes and this file are read as a format whose comments start with #.
[formats]
yml = py
editorconfig = py
gitattributes = py
ini = py

# The root .gitignore is the vendored GitHub template, so no glob names it.
[*.{md,cs,ps1,yml,editorconfig,csproj,props,targets,config,gitattributes,ini}]
BasedOnStyles = TRNG

# STYLEGUIDE.md states the banned phrases.
[STYLEGUIDE.md]
BasedOnStyles =
