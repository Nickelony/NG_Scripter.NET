# The docs write US English; each stem catches its British form and the words built on it.
extends: existence
message: "Write the US spelling of '%s'."
level: error
ignorecase: true
nonword: true
tokens:
  - '\b(?:un|re|non|pre|post|dis|mis|over|under|co|de|sub|inter|anti|semi|multi|bi|tri|auto|super|out|mid)?(?:acknowledgement|ageing|aluminium|apologis|armour|authoris|behaviour|catalogue|categoris|colour|criticis|customis|defence|endeavour|equalis|favour|finalis|flavour|generalis|grey|harbour|honour|humour|initialis|instalment|itemis|judgement|labell|labour|licence|litre|localis|manoeuvr|marshall|maximis|memoris|minimis|modell(?:ed|ing|ers?)|moustache|neighbour|normalis|odour|offence|parlour|plough|practis|pretence|prioritis|recognis|rigour|rumour|saviour|sceptic|serialis|sizeable|skilful|splendour|stabilis|standardis|summaris|synchronis|tumour|utilis|valour|vapour|visualis|wilful|whilst|amongst|artefact|behove|cheque|enquir|focuss|jewellery|kerb|mould|storey|travell|tyre)\w*\b'
  - '\b\w+isations?\b'
  - '\b(?:cancell(?:ed|ing)|analys(?:e|ed|ing|ers?)|centr(?:e|es|ed)|characteris(?:e|ed|es|ing)|emphasis(?:e|ed|es|ing)|dreamt|enrol|fulfil|learnt|leant|spelt|optimis(?:e|ed|es|ing)|organis(?:e|ed|es|ing)|programmes?|realis(?:e|ed|es|ing)|specialis(?:e|ed|es|ing)|full[\s-]+stop)\b'
